        condition: service_healthy
    ports:
      - "8084:8080" # Panel web 3
      - "5659:5657" # SFTP 3
      - "8085:8081" # Gatus 3
    volumes:
      - ./storage3/skypanel-config:/etc/SkyPanel
      - ./storage3/skypanel-data:/var/lib/SkyPanel
      - ./storage3/skypanel-logs:/var/log/SkyPanel
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - GIN_MODE=release
      - PUFFER_PLATFORM=docker
      - PUFFER_DOCKER_ROOT=
      - PUFFER_DOCKER_DISALLOWHOST=true
      - PUFFER_WEB_HOST=0.0.0.0:8080
      - PUFFER_PANEL_REGISTRATIONENABLED=true
      - PUFFER_PANEL_SETTINGS_COMPANYNAME=Aether Panel 3
      - PUFFER_PANEL_SETTINGS_DEFAULTTHEME=SkyPanel
      - PUFFER_PANEL_DATABASE_DIALECT=mysql
      - PUFFER_PANEL_DATABASE_URL=skypanel:skypanel_password@tcp(mysql3:3306)/skypanel?charset=utf8&parseTime=true
      - PUFFER_TEMPLATES_URL=https://templates.aetherpanel.es/templates.json
    user: "0:0"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/" ]
