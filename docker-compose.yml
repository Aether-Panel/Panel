services:
  # ==========================================
  # INSTANCIA 1 (Original)
  # ==========================================
  mysql:
    image: mariadb:10.11
    container_name: skypanel-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=skypanel_root_password
      - MYSQL_DATABASE=skypanel
      - MYSQL_USER=skypanel
      - MYSQL_PASSWORD=skypanel_password
    volumes:
      - ./storage/mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skypanel-network

  skypanel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - version=dev-docker
        - sha=local-build
    container_name: skypanel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080" # Panel web 1
      - "5657:5657" # SFTP 1
      - "8081:8081" # Gatus 1
    volumes:
      - ./storage/skypanel-config:/etc/SkyPanel
      - ./storage/skypanel-data:/var/lib/SkyPanel
      - ./storage/skypanel-logs:/var/log/SkyPanel
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - GIN_MODE=release
      - PUFFER_PLATFORM=docker
      - PUFFER_DOCKER_ROOT=
      - PUFFER_DOCKER_DISALLOWHOST=true
      - PUFFER_WEB_HOST=0.0.0.0:8080
      - PUFFER_PANEL_REGISTRATIONENABLED=true
      - PUFFER_PANEL_SETTINGS_COMPANYNAME=Aether Panel 1
      - PUFFER_PANEL_SETTINGS_DEFAULTTHEME=SkyPanel
      - PUFFER_PANEL_DATABASE_DIALECT=mysql
      - PUFFER_PANEL_DATABASE_URL=skypanel:skypanel_password@tcp(mysql:3306)/skypanel?charset=utf8&parseTime=true
      - PUFFER_TEMPLATES_URL=https://templates.aetherpanel.es/templates.json
    user: "0:0"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skypanel-network

  # ==========================================
  # INSTANCIA 2
  # ==========================================
  mysql2:
    image: mariadb:10.11
    container_name: skypanel-mysql2
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=skypanel_root_password
      - MYSQL_DATABASE=skypanel
      - MYSQL_USER=skypanel
      - MYSQL_PASSWORD=skypanel_password
    volumes:
      - ./storage2/mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skypanel-network2

  skypanel2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - version=dev-docker
        - sha=local-build
    container_name: skypanel2
    restart: unless-stopped
    depends_on:
      mysql2:
        condition: service_healthy
    ports:
      - "8082:8080" # Panel web 2
      - "5658:5657" # SFTP 2
      - "8083:8081" # Gatus 2
    volumes:
      - ./storage2/skypanel-config:/etc/SkyPanel
      - ./storage2/skypanel-data:/var/lib/SkyPanel
      - ./storage2/skypanel-logs:/var/log/SkyPanel
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - GIN_MODE=release
      - PUFFER_PLATFORM=docker
      - PUFFER_DOCKER_ROOT=
      - PUFFER_DOCKER_DISALLOWHOST=true
      - PUFFER_WEB_HOST=0.0.0.0:8080
      - PUFFER_PANEL_REGISTRATIONENABLED=true
      - PUFFER_PANEL_SETTINGS_COMPANYNAME=Aether Panel 2
      - PUFFER_PANEL_SETTINGS_DEFAULTTHEME=SkyPanel
      - PUFFER_PANEL_DATABASE_DIALECT=mysql
      - PUFFER_PANEL_DATABASE_URL=skypanel:skypanel_password@tcp(mysql2:3306)/skypanel?charset=utf8&parseTime=true
      - PUFFER_TEMPLATES_URL=https://templates.aetherpanel.es/templates.json
    user: "0:0"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skypanel-network2

  # ==========================================
  # INSTANCIA 3
  # ==========================================
  mysql3:
    image: mariadb:10.11
    container_name: skypanel-mysql3
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=skypanel_root_password
      - MYSQL_DATABASE=skypanel
      - MYSQL_USER=skypanel
      - MYSQL_PASSWORD=skypanel_password
    volumes:
      - ./storage3/mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
