services:
  # Base de datos MySQL/MariaDB
  mysql:
    profiles:
      - local-db
    image: mariadb:10.11
    container_name: skypanel-mysql
    restart: unless-stopped
    
    # Variables de entorno para MySQL
    environment:
      - MYSQL_ROOT_PASSWORD=skypanel_root_password
      - MYSQL_DATABASE=skypanel
      - MYSQL_USER=skypanel
      - MYSQL_PASSWORD=skypanel_password
    
    # Volúmenes persistentes para MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    
    # Puertos (opcional, para acceso externo)
    ports:
      - "3306:3306"
    
    # Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Redes
    networks:
      - skypanel-network

  skypanel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - version=dev-docker
        - sha=local-build
    container_name: skypanel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    
    # Puertos
    ports:
      - "8080:8080"   # Panel web
      - "5657:5657"   # SFTP
      - "8081:8081"   # Gatus (monitoring)
    
    # Volúmenes persistentes
    volumes:
      - skypanel-config:/etc/SkyPanel
      - skypanel-data:/var/lib/SkyPanel
      - skypanel-logs:/var/log/SkyPanel
      # Socket de Docker para gestionar contenedores (necesario para crear servidores)
      - /var/run/docker.sock:/var/run/docker.sock
    
    # Variables de entorno
    environment:
      - GIN_MODE=release
      - PUFFER_PLATFORM=docker
      - PUFFER_DOCKER_ROOT=
      - PUFFER_DOCKER_DISALLOWHOST=true
      # Configuración del panel
      - PUFFER_WEB_HOST=0.0.0.0:8080
      - PUFFER_PANEL_REGISTRATIONENABLED=true
      - PUFFER_PANEL_SETTINGS_COMPANYNAME=Aether Panel
      - PUFFER_PANEL_SETTINGS_DEFAULTTHEME=SkyPanel
      # Configuración de base de datos MySQL
      - PUFFER_PANEL_DATABASE_DIALECT=mysql
      - PUFFER_PANEL_DATABASE_URL=skypanel:skypanel_password@tcp(mysql:3306)/skypanel?charset=utf8&parseTime=true
      # Configuración de plantillas (vacío para deshabilitar templates de comunidad)
      - PUFFER_TEMPLATES_URL=
    
    # Permisos para acceder a Docker (necesario para gestionar contenedores de servidores)
    # NOTA: Esto otorga acceso completo al daemon de Docker del host
    # Asegúrate de que solo usuarios confiables puedan acceder a este contenedor
    user: "0:0"  # Ejecutar como root para acceso al socket de Docker
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Límites de recursos (opcional)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Redes
    networks:
      - skypanel-network

# Volúmenes nombrados
volumes:
  skypanel-config:
    driver: local
  skypanel-data:
    driver: local
  skypanel-logs:
    driver: local
  mysql-data:
    driver: local

# Redes
networks:
  skypanel-network:
    driver: bridge
