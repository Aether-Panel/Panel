services:
  # ==========================================
  # INSTANCIA 1 (Original)
  # ==========================================
  mysql:
    image: mariadb:10.11
    container_name: skypanel-mysql
    restart: unless-stopped
    # Solo accesible desde esta máquina: en Linux, Docker publica los puertos por
    # delante del firewall (ufw no los bloquea). Si algo externo necesita llegar a
    # esta base de datos, pon DB_BIND_ADDRESS=0.0.0.0 en el .env del servidor y
    # limita el acceso con reglas en la cadena DOCKER-USER de iptables.
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-skypanel_secret}
      - MYSQL_DATABASE=${DB_DATABASE:-skypanel}
      - MYSQL_USER=${DB_USER:-skypanel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-skypanel_secret}
    volumes:
      - ./storage/mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # También en la red de los servidores de juego, que la usan para sus bases de datos
    networks:
      - skypanel-network
      - skypanel-servers

  skypanel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - version=2.1.0
        - sha=local-build
    container_name: skypanel
    restart: unless-stopped
    # Al parar, el panel pide a todos los servidores de juego que se detengan (hasta 60s)
    # para que guarden sus mundos; los 10s por defecto de Docker no daban tiempo
    stop_grace_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080" # Panel web 1
      - "5657:5657" # SFTP 1

    volumes:
      - ./storage/skypanel-config:/etc/SkyPanel
      - ./storage/skypanel-data:/var/lib/SkyPanel
      - ./storage/skypanel-logs:/var/log/SkyPanel
      - //var/run/docker.sock:/var/run/docker.sock
      # Repositorio del host montado en solo lectura para verificar el commit desplegado
      - ./.git:/repo/.git:ro
    environment:
      - GIN_MODE=release
      - SKYPANEL_PLATFORM=docker
      - SKYPANEL_DOCKER_ROOT=
      - SKYPANEL_DOCKER_DISALLOWHOST=true
      # Los servidores de juego van a su propia red: llegan a MariaDB, pero no al panel
      - SKYPANEL_DOCKER_SERVERSNETWORK=skypanel-servers
      - SKYPANEL_WEB_HOST=0.0.0.0:8080

      # Para configurar como nodo esclavo (Daemon only):
      # - SKYPANEL_PANEL_ENABLE=false
      # - SKYPANEL_TOKEN_PUBLIC=http://<MASTER-IP>:8080/auth/publickey

      - SKYPANEL_PANEL_REGISTRATIONENABLED=true
      - SKYPANEL_PANEL_SETTINGS_DEFAULTTHEME=SkyPanel
      - SKYPANEL_PANEL_DATABASE_DIALECT=mysql
      - SKYPANEL_PANEL_DATABASE_URL=${DB_USER:-skypanel}:${DB_PASSWORD:-skypanel_secret}@tcp(mysql:3306)/${DB_DATABASE:-skypanel}?charset=utf8&parseTime=true
      - SKYPANEL_TEMPLATES_URL=https://templates.aetherpanel.es/templates.json
      # Cloudflare Turnstile (opcional)
      # - SKYPANEL_PANEL_TURNSTILE_ENABLED=true
      # - SKYPANEL_PANEL_TURNSTILE_SITEKEY=0x4AAA...
      # - SKYPANEL_PANEL_TURNSTILE_SECRETKEY=0x4AAA...
    user: "0:0"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skypanel-network

  # ==========================================
  # ADMINER - Administración de la base de datos del panel
  # Acceso: http://localhost:8081
  #   Sistema:      MySQL
  #   Servidor:     mysql
  #   Usuario:      ${DB_USER:-skypanel}
  #   Contraseña:   ${DB_PASSWORD:-skypanel_secret}
  #   Base de datos: ${DB_DATABASE:-skypanel}
  # (Las credenciales se toman del archivo .env)
  # ==========================================
  adminer:
    image: adminer:4
    container_name: skypanel-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Por seguridad se expone solo en localhost. Para acceder desde otros
    # equipos de la red usa "8081:8080" (no lo expongas a Internet).
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
      - ADMINER_DESIGN=pepa-linha
    networks:
      - skypanel-network

# Redes
networks:
  skypanel-network:
    driver: bridge
  # Nombre fijo: el panel crea los contenedores de juego en esta red por su nombre
  skypanel-servers:
    name: skypanel-servers
    driver: bridge
