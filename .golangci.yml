version: "2"

run:
  go: "1.25"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - revive
    - gocritic
  settings:
    govet:
      enable-all: false
    errcheck:
      check-type-assertions: false
      check-blank: false
  exclusions:
    paths:
      - docs
      - vendor
      - basura_o_desconocido
      - "web/swagger/docs.go"
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: tools/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 30
  max-same-issues: 3
