info:
  contact:
    name: SkyPanel
    url: https://SkyPanel.com
  description: SkyPanel API interface for both the panel and daemon.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: SkyPanel API
  version: "3.0"
paths:
  /api/config:
    get:
      description: Gets the editable config entries for the panel
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/EditableConfigSettings'
      security:
      - OAuth2Application:
        - none
      summary: Get config
  /api/databasehosts:
    get:
      description: Gets all database hosts registered to the panel
      responses:
        "200":
          description: Database Hosts
          schema:
            items:
              $ref: '#/definitions/DatabaseHostView'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - admin
      summary: Get database hosts
    post:
      description: Creates a database host
      parameters:
      - description: Database Host information
        in: body
        name: databaseHost
        required: true
        schema:
          $ref: '#/definitions/DatabaseHostCreate'
      responses:
        "200":
          description: Database Host created
          schema:
            $ref: '#/definitions/DatabaseHostView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - admin
      summary: Create database host
  /api/databasehosts/{id}:
    delete:
      description: Deletes a database host
      parameters:
      - description: Database Host Id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - admin
      summary: Delete database host
    get:
      description: Gets information about a single database host
      parameters:
      - description: Database Host Id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Database Host
          schema:
            $ref: '#/definitions/DatabaseHostView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - admin
      summary: Get database host
    put:
      description: Updates a database host with given information
      parameters:
      - description: Database Host Id
        in: path
        name: id
        required: true
        type: string
      - description: Database Host information
        in: body
        name: databaseHost
        required: true
        schema:
          $ref: '#/definitions/DatabaseHostUpdate'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - admin
      summary: Update database host
  /api/nodes:
    get:
      description: Gets all nodes registered to the panel
      responses:
        "200":
          description: Nodes
          schema:
            items:
              $ref: '#/definitions/Node'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - nodes.view
      summary: Get nodes
    post:
      description: Creates a node
      responses:
        "200":
          description: Node created
          schema:
            $ref: '#/definitions/Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - nodes.create
      summary: Create node
  /api/nodes/{id}:
    delete:
      description: Deletes the node
      parameters:
      - description: Node Id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - OAuth2Application:
        - nodes.delete
      summary: Deletes a node
    get:
      description: Gets information about a single node
      parameters:
      - description: Node Id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Nodes
          schema:
            $ref: '#/definitions/Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
