        type: string
      max_databases:
        type: integer
      name:
        type: string
      node_id:
        type: integer
      password:
        type: string
      port:
        type: integer
      username:
        type: string
    required:
    - host
    - name
    - password
    - port
    - username
    type: object
  DatabaseHostUpdate:
    properties:
      host:
        type: string
      max_databases:
        type: integer
      name:
        type: string
      node_id:
        type: integer
      password:
        type: string
      port:
        type: integer
      username:
        type: string
    required:
    - host
    - name
    - port
    - username
    type: object
  DatabaseHostView:
    properties:
