      display:
        type: string
      if:
        type: string
      order:
        type: integer
      variables:
        items:
          type: string
        type: array
    type: object
  KeepAlive:
    properties:
      command:
        type: string
      frequency:
        type: string
    type: object
  Metadata:
    properties:
      type:
        type: string
    type: object
  MetadataWithIf:
    properties:
      if:
        type: string
      type:
        type: string
    type: object
  NamedServer:
    properties:
      data:
        additionalProperties:
          $ref: '#/definitions/Variable'
        type: object
      display:
        type: string
      environment:
        $ref: '#/definitions/Metadata'
      groups:
        items:
