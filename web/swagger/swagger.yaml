      memoryFree:
        type: integer
      memoryTotal:
        type: integer
      memoryUsed:
        type: integer
      networkBytesRecv:
        type: integer
      networkBytesSent:
        type: integer
      os:
        type: string
      platform:
        type: string
      platformVersion:
        type: string
      uptime:
        type: integer
    type: object
  Task:
    properties:
      cronSchedule:
        type: string
      description:
        type: string
      name:
        type: string
      operations:
        items:
          $ref: '#/definitions/MetadataWithIf'
        type: array
    required:
    - operations
    type: object
  Template:
    properties:
      data:
        additionalProperties:
          $ref: '#/definitions/Variable'
        type: object
      display:
        type: string
      environment:
        $ref: '#/definitions/Metadata'
      groups:
        items:
          $ref: '#/definitions/Group'
        type: array
      icon:
        type: string
      id:
        type: string
      install:
        items:
          $ref: '#/definitions/MetadataWithIf'
        type: array
      keepAlive:
        $ref: '#/definitions/KeepAlive'
      name:
        type: string
      query:
        $ref: '#/definitions/Metadata'
      readme:
        type: string
      requirements:
        $ref: '#/definitions/Requirements'
      run:
        $ref: '#/definitions/Execution'
      stats:
        $ref: '#/definitions/Metadata'
      supportedEnvironments:
        items:
          $ref: '#/definitions/Metadata'
        type: array
      type:
        type: string
      uninstall:
        items:
          $ref: '#/definitions/MetadataWithIf'
        type: array
    type: object
  TemplateRepo:
    properties:
      branch:
        type: string
      id:
        type: integer
      isLocal:
        type: boolean
      name:
        type: string
      url:
        type: string
    type: object
  ThemeConfig:
    properties:
      active:
        example: default
        type: string
      available:
        example:
        - alternativeTheme
        items:
          type: string
        type: array
      settings:
        example: '{}'
