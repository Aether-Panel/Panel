    type: object
  ServerTasks:
    properties:
      tasks:
        additionalProperties:
          $ref: '#/definitions/ServerTask'
        type: object
    type: object
  ServerUser:
    properties:
      scopes:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  Setting:
    properties:
      value: {}
    type: object
  StdinConsoleConfiguration:
    properties:
      ip:
        type: string
      password:
        type: string
      port:
        type: string
      type:
        type: string
    type: object
  SystemInfo:
    properties:
      arch:
        type: string
      cpuCores:
        type: integer
      cpuModel:
        type: string
      cpuThreads:
