      scopes:
        items:
          type: string
        type: array
      updatedAt:
        type: string
    required:
    - name
    type: object
  models.UserPermissionsView:
    properties:
      email:
        type: string
      scopes:
        items:
          $ref: '#/definitions/Scopes'
        type: array
      username:
        type: string
    type: object
  utils.JvmStats:
    properties:
      heapTotal:
        type: integer
      heapUsed:
        type: integer
      metaspaceTotal:
        type: integer
      metaspaceUsed:
        type: integer
