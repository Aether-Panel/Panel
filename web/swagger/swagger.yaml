        type: boolean
      data: {}
      icon:
        type: string
      id:
        type: string
      ip:
        type: string
      name:
        type: string
      node:
        $ref: '#/definitions/Node'
      nodeId:
        type: integer
      port:
        type: integer
      type:
        type: string
      users:
        items:
          $ref: '#/definitions/ServerUser'
