      groups:
        items:
          $ref: '#/definitions/Group'
        type: array
      icon:
        type: string
      id:
        type: string
      install:
        items:
          $ref: '#/definitions/MetadataWithIf'
        type: array
      keepAlive:
        $ref: '#/definitions/KeepAlive'
      query:
        $ref: '#/definitions/Metadata'
      requirements:
        $ref: '#/definitions/Requirements'
      run:
        $ref: '#/definitions/Execution'
      stats:
        $ref: '#/definitions/Metadata'
      supportedEnvironments:
        items:
          $ref: '#/definitions/Metadata'
        type: array
      type:
        type: string
      uninstall:
        items:
          $ref: '#/definitions/MetadataWithIf'
        type: array
    type: object
  ServerFlags:
    properties:
      autoRestartOnCrash:
