          type: integer
        type: array
    type: object
  ServerRunning:
    properties:
      installing:
        type: boolean
      running:
        type: boolean
    type: object
  ServerSearchResults:
    properties:
      paging:
        $ref: '#/definitions/Paging'
      servers:
