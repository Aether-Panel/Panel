name: CI

on:
  # fide-dev2.0 is a working branch merged into dev2.0 by review; it runs the same checks,
  # and the image publishing steps below stay limited to main and dev2.0
  push:
    branches: [ "main", "dev2.0", "fide-dev2.0" ]
  pull_request:
    branches: [ "main", "dev2.0", "fide-dev2.0" ]

# Cancels in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Go Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: |
          go mod tidy
          go mod download

      - name: Create frontend dist stub (required for go:embed)
        # go:embed requires at least one embeddable file in the directory.
        # The real dist is built by the Docker/Node build process, not by CI.
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...



      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Code Quality / Lint
  # ─────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create frontend dist stub (required for go:embed)
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Check Go formatting (gofmt)
        run: |
          # Exclude the gatus vendored sub-tree and generated docs
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './docs/*' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted correctly:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix formatting."
            exit 1
          fi
          echo "All Go files are properly formatted."

      - name: Run go vet
        run: |
          go mod tidy
          go vet $(go list ./... | grep -v '/docs')

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=15m

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "v0.7.0"
          install-go: false

      - name: Run gosec (Go Security)
        uses: securego/gosec@a7abd50b2947e53b26a7e200223e635ce36fac9b # master
        with:
          args: -exclude=G104,G107,G115,G122,G204,G301,G302,G304,G306,G702,G703,G706 ./...

      # trivy-action's own setup, and a plain download of the release file, both fail on the
      # runners: GitHub answers 504 for Trivy's 52 MB release asset (2026-11-09), so Code Quality
      # failed before it scanned anything. Trivy comes from its official image instead, pinned by
      # digest so what it holds cannot change, and the three scans below use that binary.
      - name: Install Trivy
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          set -euo pipefail
          docker pull --quiet "$TRIVY_IMAGE"
          id=$(docker create "$TRIVY_IMAGE")
          mkdir -p "$HOME/.local/bin"
          docker cp "$id:/usr/local/bin/trivy" "$HOME/.local/bin/trivy"
          docker rm "$id" > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          skip-setup-trivy: true
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          skip-setup-trivy: true
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          scanners: 'secret'

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          skip-setup-trivy: true
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          scanners: 'config'


  # ─────────────────────────────────────────────
  # JOB 2.5: Frontend Tests & Lint
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # the newest 22.x, not whatever the runner has cached: astro asks for a recent patch and
          # an older cached one failed the install on some runners
          check-latest: true
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Install dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run Frontend Lint & Typecheck
        working-directory: ./client/frontend
        run: |
          yarn lint
          yarn typecheck

      - name: Run Frontend Unit Tests
        working-directory: ./client/frontend
        run: yarn test

      - name: Verify Frontend Build
        working-directory: ./client
        run: yarn build

  # ─────────────────────────────────────────────
  # JOB 3: Build Binary
  # ─────────────────────────────────────────────
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test, lint, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: |
          go mod tidy
          go mod download

      - name: Create frontend dist stub (required for go:embed)
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Build binary
        run: |
          go build \
            -ldflags="-X 'github.com/SkyPanel/SkyPanel/v3/internal/config.Version=${{ github.sha }}'" \
            -o bin/skypanel \
            ./cmd/panel

      - name: Verify binary exists
        run: |
          ls -lh bin/skypanel
          file bin/skypanel

  # ─────────────────────────────────────────────
  # JOB 4: Python E2E Tests (mocked)
  # ─────────────────────────────────────────────
  e2e-python:
    name: Python E2E Tests
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r test/e2e/requirements.txt

      - name: Run Python E2E tests
        run: |
          pytest test/e2e/ \
            --html=report.html --self-contained-html || echo "PyTest falló (esperado si los tests son un mock)"

  # ─────────────────────────────────────────────
  # JOB 5: Docker Build & Push
  # Only pushes on merges to main, dev2.0 only builds
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, e2e-python]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            version=${{ github.ref_name }}
            sha=${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 6: Runtime Images Build & Push
  # Pushes the base runtime images used by game servers
  # (ubuntu, steamcmd, generic) to GHCR. Pushes on main and dev2.0.
  # ─────────────────────────────────────────────
  runtime-images:
    name: Runtime Images
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: ubuntu
            dockerfile: docker/runtime-images/ubuntu/Dockerfile
          - name: steamcmd
            dockerfile: docker/runtime-images/steamcmd/Dockerfile
          - name: generic
            dockerfile: docker/runtime-images/generic/Dockerfile
          # one image per PHP version, tagged with it (ghcr.io/aether-panel/php:8.3)
          - name: php
            dockerfile: docker/runtime-images/php/Dockerfile
            version: "8.2"
          - name: php
            dockerfile: docker/runtime-images/php/Dockerfile
            version: "8.3"
          - name: php
            dockerfile: docker/runtime-images/php/Dockerfile
            version: "8.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Building these images takes long (PHP compiles its extensions, and arm64 runs emulated),
      # so a change that does not touch an image does not rebuild it. A push to main or dev2.0
      # always builds, since that is what publishes.
      - name: Did this image change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev2.0') }}
        run: |
          build=true
          if [ "$PUBLISH" != "true" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
             && git diff --quiet "$BASE" HEAD -- "docker/runtime-images/${{ matrix.name }}"; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build $build"

      - name: Set up QEMU (for multi-arch builds)
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        if: steps.changed.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        if: steps.changed.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # an image built per version is tagged with that version, never latest or the branch,
          # which the versions would overwrite in turn
          tags: |
            type=ref,event=branch,enable=${{ !matrix.version }}
            type=sha,prefix=sha-,format=short,enable=${{ !matrix.version }}
            type=raw,value=latest,enable=${{ !matrix.version && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.version }},enable=${{ !!matrix.version && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev2.0') }}
            type=sha,prefix=${{ matrix.version }}-sha-,format=short,enable=${{ !!matrix.version }}

      - name: Build and push Docker image
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ github.workspace }}/docker/runtime-images/${{ matrix.name }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            RUNTIME_VERSION=${{ matrix.version }}
          # arm64 builds emulated and slowly: only what is published gets it, a check builds amd64
          platforms: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev2.0') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev2.0') && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
