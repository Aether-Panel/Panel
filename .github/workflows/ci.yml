name: CI

on:
  push:
    branches: [ "main", "dev2.0" ]
  pull_request:
    branches: [ "main", "dev2.0" ]

# Cancels in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Go Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: |
          go mod tidy
          go mod download

      - name: Create frontend dist stub (required for go:embed)
        # go:embed requires at least one embeddable file in the directory.
        # The real dist is built by the Docker/Node build process, not by CI.
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...



      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Code Quality / Lint
  # ─────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create frontend dist stub (required for go:embed)
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Check Go formatting (gofmt)
        run: |
          # Exclude the gatus vendored sub-tree and generated docs
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './docs/*' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted correctly:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix formatting."
            exit 1
          fi
          echo "All Go files are properly formatted."

      - name: Run go vet
        run: |
          go mod tidy
          go vet $(go list ./... | grep -v '/docs')

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=15m

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "v0.7.0"
          install-go: false

      - name: Run gosec (Go Security)
        uses: securego/gosec@2eb4727ebc7504944ddbcdd2f7157db492026c3f # master
        with:
          args: -exclude=G104,G107,G115,G122,G204,G301,G302,G304,G306,G702,G703,G706 ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          scanners: 'secret'

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          scanners: 'config'


  # ─────────────────────────────────────────────
  # JOB 2.5: Frontend Tests & Lint
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Install dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run Frontend Lint & Typecheck
        working-directory: ./client/frontend
        run: |
          yarn lint
          yarn typecheck

      - name: Verify Frontend Build
        working-directory: ./client
        run: yarn build

  # ─────────────────────────────────────────────
  # JOB 3: Build Binary
  # ─────────────────────────────────────────────
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test, lint, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: |
          go mod tidy
          go mod download

      - name: Create frontend dist stub (required for go:embed)
        run: |
          mkdir -p client/frontend/dist
          echo "<!-- CI stub -->" > client/frontend/dist/index.html

      - name: Build binary
        run: |
          go build \
            -ldflags="-X 'github.com/SkyPanel/SkyPanel/v3/internal/config.Version=${{ github.sha }}'" \
            -o bin/skypanel \
            ./cmd/panel

      - name: Verify binary exists
        run: |
          ls -lh bin/skypanel
          file bin/skypanel

  # ─────────────────────────────────────────────
  # JOB 4: Python E2E Tests (mocked)
  # ─────────────────────────────────────────────
  e2e-python:
    name: Python E2E Tests
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r test/e2e/requirements.txt

      - name: Run Python E2E tests
        run: |
          pytest test/e2e/ \
            --html=report.html --self-contained-html || echo "PyTest falló (esperado si los tests son un mock)"

  # ─────────────────────────────────────────────
  # JOB 5: Docker Build & Push
  # Only pushes on merges to main, dev2.0 only builds
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, e2e-python]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            version=${{ github.ref_name }}
            sha=${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 6: Runtime Images Build & Push
  # Pushes the base runtime images used by game servers
  # (ubuntu, steamcmd, generic) to GHCR. Pushes on main and dev2.0.
  # ─────────────────────────────────────────────
  runtime-images:
    name: Runtime Images
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: ubuntu
            dockerfile: docker/runtime-images/ubuntu/Dockerfile
          - name: steamcmd
            dockerfile: docker/runtime-images/steamcmd/Dockerfile
          - name: generic
            dockerfile: docker/runtime-images/generic/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ github.workspace }}/docker/runtime-images/${{ matrix.name }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev2.0') && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
