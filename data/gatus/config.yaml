endpoints:
    - conditions:
        - '[STATUS] == 200'
        - '[RESPONSE_TIME] < 3000'
      group: Panel SkyPanel
      interval: 1m
      name: Panel Principal
      url: http://localhost:8080/api/config
    - conditions:
        - '[STATUS] == 200'
        - '[BODY].message == daemon is running'
        - '[RESPONSE_TIME] < 5000'
      group: Nodos SkyPanel
      interval: 1m
      name: nodo
      url: http://192.168.0.13:8080/daemon
    - conditions:
        - '[STATUS] == 200'
        - '[BODY].message == daemon is running'
        - '[RESPONSE_TIME] < 5000'
      group: Nodos SkyPanel
      interval: 1m
      name: LocalNode
      url: http://192.168.0.3:8080/daemon
storage:
    type: memory
ui:
    header: Aether Panels
web:
    address: 127.0.0.1
    port: 8081
