endpoints:
    - conditions:
        - '[STATUS] == 200'
        - '[RESPONSE_TIME] < 3000'
      group: Panel SkyPanel
      interval: 1m
      name: Panel Principal
      url: http://localhost:8080/api/config
    - conditions:
        - '[STATUS] == 200'
        - '[BODY].message == daemon is running'
        - '[RESPONSE_TIME] < 5000'
      group: Nodos SkyPanel
      interval: 1m
      name: LocalNode
      url: http://localhost:8080/daemon
storage:
    type: memory
web:
    address: 0.0.0.0
    port: 8081
